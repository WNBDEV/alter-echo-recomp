# Alter Echo settings. run.sh copies this to settings.ini on first run;
# edit settings.ini. Anything set on the command line still wins, e.g.
#   RECOMP_SCALE=1 ./run.sh

# Picture
resolution_scale = 2        # 1 = 640x480 as on the console, 2 = 1280x960,
                            # 3 = 1920x1440, 4 = 2560x1920
fullscreen = 0              # 1 = start fullscreen. Alt+Enter or F11 toggles
                            # while playing either way.

# Controller
rumble = 1                  # 1 = the pad vibrates when the game asks

# Sound
reverb = 1                  # 1 = room reverb on the sounds the game sends
                            # to it, 0 = dry

# Advanced -- leave alone unless something looks wrong
direct_render_targets = 1   # 0 if a glow/sky/water effect looks broken
