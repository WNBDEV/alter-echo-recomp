# Alter Echo settings. run.sh copies this to settings.ini on first run;
# edit settings.ini. Anything set on the command line still wins, e.g.
#   RECOMP_SCALE=1 ./run.sh

# Picture
resolution_scale = 2        # 1 = 640x480 as on the console, 2 = 1280x960,
                            # 3 = 1920x1440, 4 = 2560x1920
fullscreen = 0              # 1 = start fullscreen. Alt+Enter or F11 toggles
                            # while playing either way.
texture_filtering = 16      # 0 = top texture level only (distant surfaces
                            # shimmer), 1 = mipmaps as the game asks,
                            # 2/4/8/16 = plus anisotropic filtering: sharper
                            # floors and walls seen at an angle
sharpen = 0                 # 0 = off .. 1 = strongest: sharpens the picture
                            # as it reaches the window (the game's textures
                            # were made for a 480i TV; 0.3-0.5 suits 2x)

# Controller
rumble = 1                  # 1 = the pad vibrates when the game asks

# Keyboard and mouse
input = auto                # auto = keyboard, mouse and a controller all
                            # work at once; controller = controller only;
                            # keyboard = keyboard and mouse only (a
                            # controller plugged in is ignored)
mouse_sensitivity = 1.0     # how fast the mouse turns the camera; 0 = no
                            # mouse look. Click in the window to use the
                            # mouse, Alt+Tab to let go of it
mouse_invert_y = 0          # 1 = the mouse alone tilts the other way (the
                            # game's own Pitch Axis option flips mouse and
                            # stick together)
camera_flip_x = 1           # 1 = the camera turns the way you push the
                            # right stick or move the mouse; 0 = the
                            # console's way (push right, view turns left)
camera_flip_y = 1           # 1 = the camera tilts the way you push the
                            # right stick or move the mouse; 0 = the
                            # console's way (push up, view tilts down)
mouse_deadzone = 0.40       # where the smallest mouse movement starts on the
                            # stick: the game ignores the stick up to 0.40.
                            # Lower if small movements do nothing, higher if
                            # the camera jumps when you barely move
show_fps = 0                # 1 = frame counter in the corner from the start;
                            # F1 shows or hides it while playing

# Key bindings: the keys that press each controller button. Several keys
# are separated by commas (bind_a = Space, Enter); none = no key.
# Key names: A-Z, 0-9, F3-F10, F12, Space, Enter, Escape, Tab, Backspace,
# Shift, Ctrl, Alt, CapsLock, Up, Down, Left, Right, Insert, Delete, Home,
# End, PageUp, PageDown, Numpad0-Numpad9, Minus, Equals, LeftBracket,
# RightBracket, Semicolon, Apostrophe, Comma, Period, Slash, Backslash,
# Grave, MouseLeft, MouseRight, MouseMiddle, Mouse4, Mouse5, WheelUp,
# WheelDown. What each button does is from the game's move list
# (pause menu, View Moves).
bind_move_up = W            # left stick: move
bind_move_down = S
bind_move_left = A
bind_move_right = D
bind_x = MouseLeft          # X: attack (the sword combos)
bind_y = MouseRight         # Y: jump attack in the air, grenade
bind_a = Space              # A: jump, roll; select in menus
bind_b = F                  # B: gun smash, roll attack; cancel in menus
bind_lstick_click = Shift   # left stick click: block while held;
                            # Shift+Space rolls
bind_white = C              # White: block, too
bind_lt = Q                 # left trigger: morph to gun form
bind_rt = E                 # right trigger: morph to sword form
bind_black = WheelUp, WheelDown, Tab   # Black: next gun
bind_rstick_click = MouseMiddle, R     # right stick click: time dilation
bind_start = Enter, Escape  # START: pause; done in the Options menu
bind_back = Backspace       # BACK
bind_dpad_up = Up           # d-pad: menus; picking targets in time
                            # dilation (W A S D do that too, there)
bind_dpad_down = Down
bind_dpad_left = Left
bind_dpad_right = Right
bind_look_up = I            # right stick: the camera from keys, for
bind_look_down = K          # playing without a mouse
bind_look_left = J
bind_look_right = L

# Advanced -- leave alone unless something looks wrong
direct_render_targets = 1   # 0 if a glow/sky/water effect looks broken
